[package]
name = "scopes"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
crossterm = { version = "0.29", optional = true }
gmt_dos-clients_io.workspace = true
gmt_dos-clients_lom.workspace = true
gmt_dos-clients_optics-state.workspace = true
gmt_dos-clients_scope = { version = "3.1.1", features = ["server"] }
gmt_dos-clients_scope-client = { version = "0.2.3" }
interface.workspace = true
tokio.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "rbms"
path = "src/bin/rbms.rs"
required-features = ["crossterm"]
